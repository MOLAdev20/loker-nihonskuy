name: Deploy Laravel to VPS

on:
  push:
    branches:
      - master # Script ini bakal jalan otomatis tiap kali ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Masuk ke direktori project lu di VPS
            cd /var/www/loker-nihonskuy
            
            # Tarik kode terbaru dari GitHub
            git pull origin master
            
            # Install dependency PHP tanpa interaksi
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            # Update database (pake --force biar ga minta konfirmasi y/n)
            php artisan migrate --force
            
            # Clear & Cache config biar performa kenceng
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # --- 2 BARIS AJAIB BUAT NGASIH TAU LETAK NODE & NPM ---
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Kalo lu ada build aset frontend (React/Vite), uncomment dua baris di bawah:
            npm install
            npm run build